<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mascot Close-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap">
<style>
  :root {
    --bg:#2c2d30; --floor-a:#2f3033; --floor-b:#343538;
    --ink:#f2f0e9; --muted:#8c8d93;
    color-scheme: dark;
  }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* very subtle checker floor, kept well behind the mascot */
  .floor {
    position:fixed; left:50%; bottom:-4vh; width:400vw; height:500vh;
    transform:translateX(-50%) perspective(1600px) rotateX(62deg); transform-origin:50% 100%;
    background:repeating-conic-gradient(var(--floor-a) 0 25%, var(--floor-b) 0 50%) 50% 100% / var(--tile) var(--tile);
    --tile:min(150px, 24vw);
    -webkit-mask-image:linear-gradient(to top, #000 0%, #000 42%, transparent 100%);
            mask-image:linear-gradient(to top, #000 0%, #000 42%, transparent 100%);
    pointer-events:none;
  }

  .stage {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .mascot-wrap { width:min(360px, 84vw, 64vh); margin:0; }
  .mascot { display:block; width:100%; height:auto; overflow:visible; touch-action:none; }
  /* no outlines: each plane is stroked thinly in its own colour only to seal the
     anti-aliasing hairlines between neighbours; planes are painted far-to-near */
  .mascot .fills polygon { stroke-width:0.7; stroke-linejoin:round; }
  .mascot .eye { fill:#F2F0E9; fill-rule:evenodd; stroke:none; }

  .hint {
    position:fixed; left:22px; top:calc(20px + env(safe-area-inset-top, 0px));
    font-weight:500; font-size:14px; line-height:1; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); pointer-events:none; transition:opacity .9s ease;
  }
  .hint.gone { opacity:0; }

  /* minimal motion: a slow 2-3px hover and a matching shadow breath */
  @keyframes hover  { from { transform:translateY(-4px); } to { transform:translateY(4px); } }   /* SVG units: ~1.4px at 360px wide */
  @keyframes shadow { from { transform:scale(.955, .93); opacity:.5; } to { transform:scale(1, 1); opacity:.6; } }
  .mascot .head   { animation:hover 3.8s ease-in-out infinite alternate; }
  .mascot .shadow { transform-box:fill-box; transform-origin:center; animation:shadow 3.8s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .mascot .head, .mascot .shadow { animation:none; } .hint { transition:none; } }
  html[data-still] .mascot .head, html[data-still] .mascot .shadow { animation:none; }
</style>
</head>
<body>
<div class="floor" aria-hidden="true"></div>
<main class="stage">
  <figure class="mascot-wrap">
    <svg class="mascot" viewBox="-540 -500 1080 1050" width="1080" height="1050" role="img" aria-label="Spiky low-poly cat mascot head that turns to follow your cursor">
      <defs>
        <!-- this frame's head silhouette (rebuilt every frame): the eyes are clipped to it so a
             flat eye never sticks out past the head as it turns away -->
        <clipPath id="head-clip"><path id="head-clip-path" d=""/></clipPath>
        <filter id="shadow-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
        <!-- white rim: the rendered silhouette (whatever the angle) grown by 8 units and painted
             white; a near-black copy grown by 1.5 sits on top so the anti-aliased joins between
             planes show dark rather than white; then the head itself -->
        <filter id="rim" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="8" result="outer"/>
          <feFlood flood-color="#ffffff"/>
          <feComposite in2="outer" operator="in" result="rim"/>
          <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="inner"/>
          <feFlood flood-color="#040404"/>
          <feComposite in2="inner" operator="in" result="base"/>
          <feMerge><feMergeNode in="rim"/><feMergeNode in="base"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <ellipse class="shadow" cx="0" cy="500" rx="300" ry="30" fill="#000" opacity=".5" filter="url(#shadow-blur)"/>
      <g class="head">
        <g class="fills" filter="url(#rim)"></g>
      </g>
    </svg>
  </figure>
</main>
<div class="hint" id="hint">Move your cursor</div>

<script>
(() => {
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // Local debug knobs (ignored when there is no query string):
  //   index.html?still            freeze the hover and the cursor follow (stable screenshots)
  //   index.html?look=0.6,-0.3    fix the gaze target (x right, y down, each -1..1)
  //   index.html?yaw=90&pitch=0   fix the head's angles in degrees (90 = right side view)
  //   index.html?ortho            no perspective (for comparing against the reference views)
  const params = new URLSearchParams(location.search);
  const STILL = params.has('still');
  const reduceMotion = STILL || matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (STILL) document.documentElement.dataset.still = '';

  // ------------------------------------------------------------------ mesh
  const MESH = JSON.parse(document.getElementById('mascot-mesh').textContent);
  const V = MESH.v, F = MESH.f, G = MESH.g;   // triangles, and the drawn plane each belongs to
  const GN = new Float64Array((Math.max(...G) + 1) * 3), tarea = new Float64Array(F.length);
  const fills = document.querySelector('.mascot .fills');
  const polys = F.map(() => fills.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'polygon')));
  // eyes: flat rings lying just in front of the face panel, painted in the same far-to-near list
  const EYES = MESH.eyes || [];
  const eyeEls = EYES.map(() => { const e = fills.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'path')); e.setAttribute('class', 'eye'); e.setAttribute('clip-path', 'url(#head-clip)'); return e; });

  }

  const P = S.pointer;
  function pointerAt(e) {

    P.ny = clamp(e.clientY / innerHeight * 2 - 1, -1, 1);

    window.addEventListener('pointermove', pointerAt, { passive: true });
    window.addEventListener('pointerdown', pointerAt, { passive: true });
    // a touch has no hover: hold the gaze where the finger was for a moment, then drift back
    let release = 0;
    window.addEventListener('pointerdown', () => clearTimeout(release));
    window.addEventListener('pointerup', e => { if (e.pointerType === 'touch') release = setTimeout(() => { P.has = false; }, 1400); });

        const bx = proj[b * 3], by = -proj[b * 3 + 1], bz = proj[b * 3 + 2];
        area += proj[a * 3] * proj[b * 3 + 1] - proj[b * 3] * proj[a * 3 + 1];
        nx += (ay - by) * (az + bz); ny += (az - bz) * (ax + bx); nz += (ax - bx) * (ay + by);
        zsum += az;
      }
      depth[fi] = zsum / 3; tarea[fi] = area;
      const g = G[fi]; GN[g * 3] += nx; GN[g * 3 + 1] += ny; GN[g * 3 + 2] += nz;
    }
    // 2. draw: every triangle of a plane takes the plane's one shade
    let clipD = '';
    for (let fi = 0; fi < F.length; fi++) {
      const el = polys[fi];
      if (!(tarea[fi] > 0)) { el.style.display = 'none'; continue; }
      const g = G[fi];
      let nx = GN[g * 3], ny = GN[g * 3 + 1], nz = GN[g * 3 + 2];
      const l = Math.hypot(nx, ny, nz) || 1;
      if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
      const i = Math.pow(Math.max(0, (nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / l), 1.2);
      const c = Math.round(4 + 24 * i);   // near-black: planes range from #040404 to about #1C1C1C
      el.style.display = '';
      el.setAttribute('fill', `rgb(${c},${c},${c})`);
      el.setAttribute('stroke', `rgb(${c},${c},${c})`);
      const f = F[fi];
      const pts = `${f1(proj[f[0] * 3])},${f1(proj[f[0] * 3 + 1])} ${f1(proj[f[1] * 3])},${f1(proj[f[1] * 3 + 1])} ${f1(proj[f[2] * 3])},${f1(proj[f[2] * 3 + 1])}`;
      el.setAttribute('points', pts);
      clipD += 'M' + pts.replace(/ /g, 'L') + 'Z';
    }
    clipPath.setAttribute('d', clipD);
    // 3. eyes: project each ring through the same turn; hide an eye once its face turns away,
    //    and sort it just in front of the panel it lies on so nearer parts of the head cover it
    EYES.forEach((e, k) => {
      const el = eyeEls[k];
      const n = e.n, nx1 = n[0] * cy + n[2] * sy, nz1 = -n[0] * sy + n[2] * cy, nz2 = -n[1] * sp + nz1 * cp;
      if (nz2 < 0.15) { el.style.display = 'none'; depth[F.length + k] = -1e9; return; }   // hidden once its face turns away
      const ring = r => 'M' + r.map(p => { const q = project(p); return `${f1(q[0])},${f1(q[1])}`; }).join('L') + 'Z';
      el.style.display = '';
      el.setAttribute('d', ring(e.outer) + ring(e.inner));
      depth[F.length + k] = Math.max(...e.outer.map(p => project(p)[2])) + 10;   // just in front of what it lies on
    });
    // painter's order: far first
    order.sort((a, b) => depth[a] - depth[b]);
    for (const i of order) fills.appendChild(els[i]);
  }

  // ------------------------------------------------------------------ frame
  let lastMs = performance.now();
  function frame(nowMs) {
    const dt = Math.min(0.05, Math.max(0.001, (nowMs - lastMs) / 1000));
    lastMs = nowMs; S.t += dt;
    const tx = P.has ? P.nx : 0, ty = P.has ? P.ny : 0;
    S.yaw.target = tx * LOOK.yaw;
    S.pitch.target = ty > 0 ? ty * LOOK.pitchDown : ty * LOOK.pitchUp;
    stepSpring(S.yaw, dt); stepSpring(S.pitch, dt);
    if (STILL) { S.yaw.v = S.yaw.target; S.pitch.v = S.pitch.target; }
    if (FORCED) { S.yaw.v = FORCED[0]; S.pitch.v = FORCED[1]; }
    render(S.yaw.v, S.pitch.v);
    if (!STILL) requestAnimationFrame(frame);
  }
  render(FORCED ? FORCED[0] : 0, FORCED ? FORCED[1] : 0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
