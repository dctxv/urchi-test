<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mascot Close-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap">
<style>
  :root {
    --bg:#2c2d30; --floor-a:#2f3033; --floor-b:#343538;
    --ink:#f2f0e9; --muted:#8c8d93; --rule:#4a4b50;
    color-scheme: dark;
  }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* very subtle checker floor, kept well behind the mascot */
  .floor {
    position:fixed; left:50%; bottom:-4vh; width:400vw; height:500vh;
    transform:translateX(-50%) perspective(1600px) rotateX(62deg); transform-origin:50% 100%;
    background:repeating-conic-gradient(var(--floor-a) 0 25%, var(--floor-b) 0 50%) 50% 100% / var(--tile) var(--tile);
    --tile:min(150px, 24vw);
    -webkit-mask-image:linear-gradient(to top, #000 0%, #000 42%, transparent 100%);
            mask-image:linear-gradient(to top, #000 0%, #000 42%, transparent 100%);
    pointer-events:none;
  }

  .stage {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px, 2.4vh, 22px);
    padding:calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .mascot-wrap { width:min(360px, 84vw, 64vh); margin:0; }
  .mascot { display:block; width:100%; height:auto; overflow:visible; }
  .mascot .expr { display:none; }
  .mascot[data-expr="neutral"]  .expr[data-expr="neutral"],
  .mascot[data-expr="wide"]     .expr[data-expr="wide"],
  .mascot[data-expr="closed"]   .expr[data-expr="closed"],
  .mascot[data-expr="halfopen"] .expr[data-expr="halfopen"] { display:inline; }

  /* minimal motion: a slow 2-3px hover and a matching shadow breath */
  @keyframes hover  { from { transform:translateY(-4px); } to { transform:translateY(4px); } }   /* SVG units: ~1.4px at 360px wide */
  @keyframes shadow { from { transform:scale(.955, .93); opacity:.5; } to { transform:scale(1, 1); opacity:.6; } }
  .mascot .head   { animation:hover 3.8s ease-in-out infinite alternate; }
  .mascot .shadow { transform-box:fill-box; transform-origin:center; animation:shadow 3.8s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .mascot .head, .mascot .shadow { animation:none; } }
  html[data-still] .mascot .head, html[data-still] .mascot .shadow { animation:none; }

  .modes {
    display:flex; justify-content:center; align-items:center; flex-wrap:wrap;
    gap:0 clamp(12px, 3vw, 30px); padding:0 8px; max-width:100%;
  }
  .modes button {
    appearance:none; background:none; border:0; margin:0; padding:10px 2px 8px;
    font:500 15px/1 'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
    letter-spacing:.18em; text-transform:uppercase; color:var(--muted); cursor:pointer; position:relative;
    transition:color .2s ease; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .modes button::after {
    content:''; position:absolute; left:2px; right:2px; bottom:0; height:2px; background:var(--ink);
    transform:scaleX(0); transform-origin:50% 50%; transition:transform .28s cubic-bezier(.2,.7,.2,1);
  }
  .modes button:hover, .modes button.live, .modes button.on { color:var(--ink); }
  .modes button.on::after { transform:scaleX(1); }
  .modes button:focus-visible { outline:2px solid var(--ink); outline-offset:3px; border-radius:2px; }
  .modes .sep { width:1px; height:14px; background:var(--rule); align-self:center; }
  @media (max-width: 480px) {
    .modes { gap:0 9px; }
    .modes button { font-size:12.5px; letter-spacing:.1em; padding:10px 1px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .modes button, .modes button::after { transition:none; } }
</style>
</head>
<body>
<div class="floor" aria-hidden="true"></div>
<main class="stage">
  <figure class="mascot-wrap">
    <!-- mascot:start -->
    <svg class="mascot" viewBox="-1 21 1024 970" width="1024" height="970" role="img" aria-labelledby="mascot-title" data-expr="neutral">
      <title id="mascot-title">Spiky low-poly cat mascot, neutral expression</title>
      <defs>

      </defs>
      <ellipse class="shadow" cx="511" cy="951" rx="276" ry="30" fill="#000" opacity=".5" filter="url(#shadow-blur)"/>
      <g class="head">

l="#666666" stroke="#666666"/><polygon points="1002,404 991,425 975,449 970,448 975,449 948,486 939,494 913,529 909,539 861,608 863,617 856,604 854,648 841,620 785,527 869,498 927,459 931,453" fill="#2E2E2E" stroke="#2E2E2E"/><polygon points="168,501 237,527 168,648" fill="#202020" stroke="#202020"/><polygon points="511,512 515,754 419,724 442,689 447,671 424,629 394,597 357,575 317,563 282,561 244,566 239,533 237,527" fill="#1C1C1C" stroke="#1C1C1C"/><polygon points="511,512 785,527 783,533 778,566 740,561 705,563 665,575 628,597 599,629 586,649 575,671 587,701 603,724 515,754" fill="#2B2B2B" stroke="#2B2B2B"/><polygon points="237,527 244,566 224,572 219,599 220,638 240,691 248,706 271,728 303,800 74,788 102,745 166,656 168,648" fill="#070707" stroke="#070707"/><polygon points="785,527 856,656 784,734 774,706 791,672 803,638 798,572 778,566" fill="#0E0E0E" stroke="#0E0E0E"/><polygon points="901,554 978,604 864,621 933,761 856,656 863,617 864,621 861,608" fill="#626262" stroke="#626262"/><polygon points="44,604 159,617 153,630 161,608 168,648 89,761 103,732 110,727 112,715 119,712 117,705 126,695 126,671 121,663 101,652 99,647 79,631 65,621 62,617" fill="#1E1E1E" stroke="#1E1E1E"/><polygon points="977,605 958,621 943,631 921,652 923,647 896,671 901,663 896,671 894,675 869,630" fill="#393939" stroke="#393939"/><polygon points="856,656 948,788 784,734" fill="#2B2B2B" stroke="#2B2B2B"/><polygon points="774,706 784,734 948,788 686,851 704,825 686,851 538,887 719,800 704,825 719,800 784,734 727,792 751,728" fill="#141414" stroke="#141414"/><polygon points="419,724 515,754 461,765 515,754 516,893 506,893 307,800 346,789 303,800 278,732 288,739 331,751 355,752 384,746" fill="#282828" stroke="#282828"/><polygon points="603,724 638,746 667,752 709,748 751,728 719,800 515,754" fill="#515151" stroke="#515151"/><polygon points="515,754 719,800 516,893" fill="#010101" stroke="#010101"/><polygon points="90,792 303,800 336,851 306,843 297,842 284,840 269,833 245,829 216,820 174,813 167,810" fill="#2B2B2B" stroke="#2B2B2B"/><polygon points="303,800 484,887 336,851" fill="#0F0F0F" stroke="#0F0F0F"/><polygon points="282,561 317,563 357,575 376,590 386,594 410,618 416,628 424,629 436,649 446,677 436,701 409,729 369,748 331,751 278,732 251,704 231,672 224,638 227,579 231,572 244,566" fill="#1E1E1E" stroke="#1E1E1E"/><polygon points="727,564 771,566 798,572 803,638 791,672 783,691 744,732 709,748 667,752 627,737 599,713 581,689 575,671 585,656 612,618 646,590 686,570" fill="#1E1E1E" stroke="#1E1E1E"/></g>
        <!-- eyes: a flat layer sitting just in front of the face; never wrapped onto the facet planes -->
        <g class="eyes" fill="#F2F0E9" stroke="#F2F0E9" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
          <g class="expr" data-expr="neutral"><mask id="pupil-n-l" maskUnits="userSpaceOnUse" x="203" y="531" width="248" height="248"><rect x="203" y="531" width="248" height="248" fill="#fff"/><circle cx="339" cy="616.6" r="42" fill="#000"/></mask><path d="M233,621 A100,100 0 1 0 421,621 Q327,595 233,621 Z" mask="url(#pupil-n-l)"/><mask id="pupil-n-r" maskUnits="userSpaceOnUse" x="572" y="531" width="248" height="248"><rect x="572" y="531" width="248" height="248" fill="#fff"/><circle cx="684" cy="616.6" r="42" fill="#000"/></mask><path d="M790,621 A100,100 0 1 1 602,621 Q696,595 790,621 Z" mask="url(#pupil-n-r)"/></g>
          <g class="expr" data-expr="wide"><path fill-rule="evenodd" d="M236,661 A91,109 0 1 0 418,661 A91,109 0 1 0 236,661 Z M281.5,661 A45.5,62 0 1 0 372.5,661 A45.5,62 0 1 0 281.5,661 Z"/><path fill-rule="evenodd" d="M605,661 A91,109 0 1 0 787,661 A91,109 0 1 0 605,661 Z M650.5,661 A45.5,62 0 1 0 741.5,661 A45.5,62 0 1 0 650.5,661 Z"/></g>
          <g class="expr" data-expr="closed"><path d="M239,690 Q327,755 415,690 Q327,719 239,690 Z"/><path d="M608,690 Q696,755 784,690 Q696,719 608,690 Z"/></g>
          <g class="expr" data-expr="halfopen"><mask id="pupil-h-l" maskUnits="userSpaceOnUse" x="203" y="531" width="248" height="248"><rect x="203" y="531" width="248" height="248" fill="#fff"/><circle cx="343" cy="670.5" r="36" fill="#000"/></mask><path d="M227.1,659 A100,100 0 0 0 423.6,681 Q325.3,664 227.1,659 Z" mask="url(#pupil-h-l)"/><mask id="pupil-h-r" maskUnits="userSpaceOnUse" x="572" y="531" width="248" height="248"><rect x="572" y="531" width="248" height="248" fill="#fff"/><circle cx="680" cy="670.5" r="36" fill="#000"/></mask><path d="M795.9,659 A100,100 0 0 1 599.4,681 Q697.7,664 795.9,659 Z" mask="url(#pupil-h-r)"/></g>
        </g>
      </g>
    </svg>
    <!-- mascot:end -->
  </figure>
  <nav class="modes" id="modes" aria-label="Expression">
    <button type="button" data-mode="auto" class="on" aria-pressed="true">Auto</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-mode="neutral" aria-pressed="false">Neutral</button>
    <button type="button" data-mode="wide" aria-pressed="false">Wide</button>
    <button type="button" data-mode="closed" aria-pressed="false">Closed</button>
    <button type="button" data-mode="halfopen" aria-pressed="false">Half-open</button>
  </nav>
</main>

<script>
(() => {
  const EXPRS = ['neutral', 'wide', 'closed', 'halfopen'];
  const LABELS = { neutral: 'neutral', wide: 'wide-eyed', closed: 'eyes closed', halfopen: 'half-open' };
  const CYCLE_MS = 2750;

  const mascot = document.querySelector('.mascot');
  const title = document.getElementById('mascot-title');
  const buttons = [...document.querySelectorAll('#modes button')];

  let forced = null;        // manually selected expression, or null while AUTO cycles
  let shown = 'neutral';
  let timer = 0;

  function show(expr) {
    shown = expr;
    mascot.dataset.expr = expr;
    title.textContent = `Spiky low-poly cat mascot, ${LABELS[expr]} expression`;
    updateUI();
  }
  function stopCycle() { clearInterval(timer); timer = 0; }
  function startCycle() {
    stopCycle();
    timer = setInterval(() => show(EXPRS[(EXPRS.indexOf(shown) + 1) % EXPRS.length]), CYCLE_MS);
  }
  function select(mode) {
    forced = mode === 'auto' ? null : mode;
    if (forced) { stopCycle(); show(forced); }
    else { show(shown); startCycle(); }
  }
  function updateUI() {
    for (const b of buttons) {
      const m = b.dataset.mode;
      const on = forced ? m === forced : m === 'auto';
      b.classList.toggle('on', on);
      b.classList.toggle('live', !forced && m === shown);
      b.setAttribute('aria-pressed', String(on));
    }
  }

  for (const b of buttons) b.addEventListener('click', () => select(b.dataset.mode));
  // number-key shortcuts on top of the regular Tab / Enter / Space button handling
  window.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const map = { '0': 'auto', 'a': 'auto', '1': 'neutral', '2': 'wide', '3': 'closed', '4': 'halfopen' };
    const m = map[e.key.toLowerCase()];
    if (m) select(m);
  });
  document.addEventListener('visibilitychange', () => { if (!forced) (document.hidden ? stopCycle : startCycle)(); });

  // Local debug knobs (ignored when there is no query string):
  //   index.html?expr=wide   force an expression ("deadpan" still maps to neutral)
  //   index.html?still       freeze the hover so screenshots are stable
  const params = new URLSearchParams(location.search);
  if (params.has('still')) document.documentElement.dataset.still = '';
  const wanted = params.get('expr') === 'deadpan' ? 'neutral' : params.get('expr');
  select(EXPRS.includes(wanted) ? wanted : 'auto');
})();
</script>
</body>
</html>
