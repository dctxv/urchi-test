<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mascot Close-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap">
<style>
  :root { --bg:#ffffff; --ink:#151515; --muted:#8f8f8f; color-scheme: light; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; background:var(--bg); }

  .hint {
    position:fixed; left:22px; top:calc(20px + env(safe-area-inset-top, 0px));
    font-weight:500; font-size:14px; line-height:1; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); pointer-events:none; transition:opacity .9s ease;
  }
  .hint.gone { opacity:0; }

  .modes {
    position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; flex-wrap:wrap;
    gap:0 clamp(14px, 3.2vw, 36px); padding:0 16px calc(20px + env(safe-area-inset-bottom, 0px));
    pointer-events:none;
  }
  .modes button {
    pointer-events:auto; appearance:none; background:none; border:0; margin:0; padding:10px 2px 8px;
    font:500 15px/1 'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
    letter-spacing:.18em; text-transform:uppercase; color:var(--muted); cursor:pointer; position:relative;
    transition:color .2s ease;
  }
  .modes button::after {
    content:''; position:absolute; left:2px; right:2px; bottom:0; height:2px; background:var(--ink);
    transform:scaleX(0); transform-origin:50% 50%; transition:transform .28s cubic-bezier(.2,.7,.2,1);
  }
  .modes button:hover, .modes button.live, .modes button.on { color:var(--ink); }
  .modes button.on::after { transform:scaleX(1); }
  .modes button:focus-visible { outline:2px solid var(--ink); outline-offset:3px; border-radius:2px; }
  .modes .sep { width:1px; height:14px; background:#dcdcdc; align-self:center; }
  @media (prefers-reduced-motion: reduce) { .modes button, .modes button::after, .hint { transition:none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Interactive mascot head that turns to follow your cursor"></canvas>
<div class="hint" id="hint">Move your cursor &middot; click to boop</div>
<nav class="modes" id="modes" aria-label="Expression">
  <button type="button" data-mode="auto" class="on" aria-pressed="true">Auto</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-mode="deadpan" aria-pressed="false">Deadpan</button>
  <button type="button" data-mode="wide" aria-pressed="false">Wide</button>
  <button type="button" data-mode="closed" aria-pressed="false">Closed</button>
  <button type="button" data-mode="halfopen" aria-pressed="false">Half-open</button>
</nav>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

// Local debug knobs (ignored when there is no query string):
//   index.html?expr=wide&look=0.6,-0.3&still=1
const params = new URLSearchParams(location.search);
const STILL = params.has('still');
const reduceMotion = STILL || matchMedia('(prefers-reduced-motion: reduce)').matches;

// ------------------------------------------------------------------ tunables
const CFG = {
  body:   { sx: 1.18, sy: 1.0, szFront: 0.82, szBack: 1.0, jitter: 0.09, boxy: 0.22, floor: -0.80, seed: 7 },
  // eye geometry in head units; pupil and gaze are in eye-radius units
  eye:    { r: 0.36, x: 0.54, y: -0.10, pupilRx: 0.36, pupilRy: 0.50, gazeX: 0.16, gazeY: 0.11 },
  tex:    { ex: 1.2, ey: 0.6 },   // half-extents of the eye texture projection (head units)
  look:   { yaw: 34 * D2R, pitchUp: 22 * D2R, pitchDown: 16 * D2R, roll: 0.07, shiftX: 0.10, shiftY: 0.05 },
  spring: { omega: 9.5, zeta: 0.78 },
  idle:   { boredAfter: 6, wanderAfter: 3, drowsyAfter: 14, sleepAfter: 26 },
  camera: { fov: 30, fitH: 1.95, fitW: 1.85 },
};

// The four sheet expressions: one white ring + pupil, clipped by an upper lid.
//   lidY  : lid height in eye radii (+1 top, -1 bottom)
//   slant : lid tilt, positive = higher at the outer corner
//   curve : lid bend, positive = lid rises toward the corners (crescent when low)
const EXPR = {
  wide:     { lidY:  1.40, slant: 0.00, curve: 0.00 },
  deadpan:  { lidY:  0.22, slant: 0.00, curve: 0.00 },
  halfopen: { lidY:  0.10, slant: 0.30, curve: 0.00 },
  closed:   { lidY: -0.78, slant: 0.00, curve: 0.55 },
};
const BLINK = { lidY: -0.86, curve: 0.50 };

// ------------------------------------------------------------------ renderer
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setClearColor(0xffffff, 1);
renderer.toneMapping = THREE.NoToneMapping;          // keeps the eye whites exactly white
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CFG.camera.fov, 1, 0.1, 50);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

// Studio light: a white key, soft fill, cool rim, and three low tints so the
// facets pick up the muted red / green / violet sheen from the reference sheet.
const lights = [
  [0xffffff, 1.4,  [ 2.5,  4.0,  3.5]],
  [0xffe7d6, 0.30, [-4.0,  1.5,  2.5]],
  [0xdfe3ff, 1.0,  [-2.0,  2.5, -3.0]],
  [0xff6b5e, 0.8,  [ 3.5,  2.2, -1.0]],
  [0x7dff9a, 0.5,  [ 3.0, -0.8,  1.2]],
  [0xa48cff, 0.7,  [ 1.0,  3.8, -2.2]],
];
for (const [color, intensity, pos] of lights) {
  const l = new THREE.DirectionalLight(color, intensity);
  l.position.set(...pos);
  scene.add(l);
}
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d9d9, 0.12));

// ------------------------------------------------------------------ eye texture
const hiRes = Math.min(innerWidth, innerHeight) * (devicePixelRatio || 1) > 900;
const eyeCanvas = document.createElement('canvas');
eyeCanvas.width = hiRes ? 2048 : 1024;
eyeCanvas.height = eyeCanvas.width / 2;
const eyeCtx = eyeCanvas.getContext('2d');
const eyeTex = new THREE.CanvasTexture(eyeCanvas);
eyeTex.colorSpace = THREE.SRGBColorSpace;
eyeTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
eyeTex.wrapS = eyeTex.wrapT = THREE.ClampToEdgeWrapping;
eyeTex.minFilter = THREE.LinearMipmapLinearFilter;
eyeTex.magFilter = THREE.LinearFilter;
eyeTex.generateMipmaps = true;

function drawEyes(e) {
  const g = eyeCtx, W = eyeCanvas.width, H = eyeCanvas.height;
  const PPU = W / (2 * CFG.tex.ex);
  const R = CFG.eye.r * PPU;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  for (const side of [-1, 1]) {
    g.save();
    g.translate(W / 2 + side * CFG.eye.x * PPU, H / 2 - CFG.eye.y * PPU);
    g.scale(side, -1);                     // local frame: +x outward, +y up
    // keep only what sits below the eyelid curve
    g.beginPath();
    const X0 = -1.8, X1 = 1.8, N = 56;
    for (let i = 0; i <= N; i++) {
      const x = X0 + (X1 - X0) * i / N;
      const y = e.lidY + e.slant * x + e.curve * x * x;
      if (i === 0) g.moveTo(x * R, y * R); else g.lineTo(x * R, y * R);
    }
    g.lineTo(X1 * R, -2.4 * R);
    g.lineTo(X0 * R, -2.4 * R);
    g.closePath();
    g.clip();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#000';
    g.beginPath(); g.ellipse(e.px * R, e.py * R, CFG.eye.pupilRx * R, CFG.eye.pupilRy * R, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }
}

// ------------------------------------------------------------------ materials
const headMat = new THREE.MeshPhysicalMaterial({
  color: 0x101010, roughness: 0.5, metalness: 0.15, flatShading: true,
  envMapIntensity: 0.35,
  iridescence: 0.3, iridescenceIOR: 1.35, iridescenceThicknessRange: [140, 520],
  clearcoat: 0.12, clearcoatRoughness: 0.55,
  emissive: 0xffffff, emissiveIntensity: 1, emissiveMap: eyeTex,
});
const spikeMat = headMat.clone();
spikeMat.emissiveMap = null;
spikeMat.emissive.set(0x000000);

// ------------------------------------------------------------------ geometry
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(CFG.body.seed);

function buildBody() {
  const geo = new THREE.IcosahedronGeometry(1, 1);      // non-indexed, 80 facets
  const pos = geo.attributes.position;
  const memo = new Map();
  const jitter = (x, y, z) => {
    const k = `${x.toFixed(4)}|${y.toFixed(4)}|${z.toFixed(4)}`;
    if (!memo.has(k)) memo.set(k, (rng() - 0.5) * 2);
    return memo.get(k);
  };
  const v = new THREE.Vector3();
  const B = CFG.body;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const j = jitter(v.x, v.y, v.z);
    // pull the sphere toward a cube for that chunky low-poly rock silhouette
    const m = Math.max(Math.abs(v.x), Math.abs(v.y), Math.abs(v.z));
    v.lerp(v.clone().divideScalar(m), B.boxy);
    v.multiplyScalar(1 + j * B.jitter);
    v.x *= B.sx; v.y *= B.sy; v.z *= v.z > 0 ? B.szFront : B.szBack;
    if (v.y < B.floor) v.y = B.floor;                    // flat chin
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  // Paint the eyes straight onto the front facets: planar projection UVs for
  // faces that look forward, a black corner texel for everything else.
  const uv = new Float32Array(pos.count * 2);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i += 3) {
    a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
    n.crossVectors(ab.subVectors(b, a), ac.subVectors(c, a)).normalize();
    const front = n.z > 0.05;
    for (const [k, p] of [[0, a], [1, b], [2, c]]) {
      uv[(i + k) * 2]     = front ? 0.5 + p.x / (2 * CFG.tex.ex) : 0;
      uv[(i + k) * 2 + 1] = front ? 0.5 + p.y / (2 * CFG.tex.ey) : 0;
    }
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.computeVertexNormals();
  return geo;
}

const UP = new THREE.Vector3(0, 1, 0);
function bodyRadius(d) {
  const B = CFG.body, sz = d.z > 0 ? B.szFront : B.szBack;
  return 1 / Math.sqrt((d.x / B.sx) ** 2 + (d.y / B.sy) ** 2 + (d.z / sz) ** 2);
}
function addSpike(parent, dir, len, rad, o = {}) {
  const geo = new THREE.ConeGeometry(rad, len, o.sides || 4, 1);
  geo.translate(0, len / 2, 0);
  if (o.flat) geo.scale(1, 1, o.flat);
  const d = new THREE.Vector3(...dir).normalize();
  const m = new THREE.Mesh(geo, spikeMat);
  m.position.copy(d).multiplyScalar(bodyRadius(d) * (o.sink ?? 0.8));
  m.quaternion.setFromUnitVectors(UP, d);
  if (o.twist) m.rotateY(o.twist);
  parent.add(m);
  return m;
}

const rig = new THREE.Group();             // parallax + bob
const neck = new THREE.Group();            // yaw / pitch / roll about a neck pivot
const head = new THREE.Group();            // squash & stretch
neck.position.y = -0.55;
head.position.y = 0.55;
neck.rotation.order = 'YXZ';
scene.add(rig); rig.add(neck); neck.add(head);

head.add(new THREE.Mesh(buildBody(), headMat));

// ears: tall four-sided pyramids, flattened front-to-back, leaning outward
for (const s of [-1, 1]) addSpike(head, [s * 0.50, 1, -0.05], 1.18, 0.47, { flat: 0.7, sink: 0.6, twist: s * 0.22 });

// urchin spikes around the silhouette (mirrored, with a little variation)
const SPIKES = [
  [1.00,  0.42,  0.10, 0.50, 0.18],
  [1.00, -0.02,  0.24, 0.60, 0.20],
  [0.92, -0.46,  0.14, 0.46, 0.16],
  [0.80,  0.78, -0.30, 0.44, 0.15],
  [0.98,  0.20, -0.50, 0.46, 0.15],
  [0.70, -0.25, -0.72, 0.38, 0.14],
  [0.35,  0.92, -0.50, 0.38, 0.14],
  [0.55, -0.75, -0.40, 0.32, 0.13],
  [0.86,  0.10, -0.85, 0.40, 0.14],
];
for (const s of [-1, 1])
  for (const [x, y, z, len, rad] of SPIKES)
    addSpike(head, [s * x, y, z], len * (0.9 + rng() * 0.2), rad, { twist: rng() * Math.PI });
for (const [x, y, z, len, rad] of [[0, 1, -0.35, 0.32, 0.15], [0, 0.35, -1, 0.44, 0.16], [0, -0.35, -0.95, 0.38, 0.15]])
  addSpike(head, [x, y, z], len, rad, { twist: rng() * Math.PI });

// soft contact shadow so the head sits on the white
const shadow = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.34)');
  grad.addColorStop(0.45, 'rgba(0,0,0,0.12)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(3.1, 1.2),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.y = -1.5;
  scene.add(m);
  return m;
})();

// ------------------------------------------------------------------ state
const spring = (v = 0) => ({ v, vel: 0, target: v });
function stepSpring(s, dt, omega, zeta) {
  const n = Math.max(1, Math.ceil(dt / (1 / 240)));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    const acc = -omega * omega * (s.v - s.target) - 2 * zeta * omega * s.vel;
    s.vel += acc * h;
    s.v += s.vel * h;
  }
}

const S = {
  t: 0, lastActive: 0, phase: 'awake',
  pointer: { x: 0, y: 0, nx: 0, ny: 0, has: false, inside: false },
  forced: null, shown: 'deadpan', lidRate: 14,
  lid: { ...EXPR.deadpan },
  gaze: { x: 0, y: 0 },
  blink: { active: false, t: 0, dur: 0.26, next: 1.6 },
  boop: { until: -1, t0: 0 },
  startle: { until: -1 },
  wander: { target: [0, 0], next: 0 },
  springs: { yaw: spring(), pitch: spring(), roll: spring(), x: spring(), y: spring(), sx: spring(1), sy: spring(1) },
  lastEyes: null,
};
if (!reduceMotion) { S.springs.sx.v = 0.9; S.springs.sy.v = 0.9; }   // small entrance pop

const VALID = ['deadpan', 'wide', 'closed', 'halfopen'];
if (VALID.includes(params.get('expr'))) S.forced = params.get('expr');
if (params.get('look')) {
  const [nx, ny] = params.get('look').split(',').map(Number);
  Object.assign(S.pointer, { nx: clamp(nx || 0, -1, 1), ny: clamp(ny || 0, -1, 1), has: true });
}

const easeInQuad = t => t * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
function blinkAmount(u) {
  if (u < 0.38) return easeInQuad(u / 0.38);
  if (u < 0.50) return 1;
  return 1 - easeOutCubic((u - 0.5) / 0.5);
}

function autoExpression(now) {
  if (S.boop.until > now) return now - S.boop.t0 < 0.32 ? 'wide' : 'closed';
  if (S.startle.until > now) return 'wide';
  if (S.phase === 'asleep') return 'closed';
  if (S.phase === 'drowsy') return 'halfopen';
  if (S.pointer.has && S.pointer.inside) return 'wide';
  return 'deadpan';
}
function lidRateFor(expr, now) {
  if (S.boop.until > now || S.startle.until > now) return 34;
  if (S.phase === 'asleep' && expr === 'closed') return 2.2;
  if (S.phase === 'drowsy' && expr === 'halfopen') return 2.5;
  return 14;
}

// ------------------------------------------------------------------ input
const hint = document.getElementById('hint');
const P = S.pointer;
let W = 1, H = 1;

function pointerAt(e) {
  P.x = e.clientX; P.y = e.clientY;
  P.nx = clamp(e.clientX / W * 2 - 1, -1, 1);
  P.ny = clamp(e.clientY / H * 2 - 1, -1, 1);
}
function activity() {
  if (S.phase !== 'awake') {
    S.startle.until = S.t + (S.phase === 'asleep' ? 0.9 : 0.5);
    S.springs.pitch.vel -= S.phase === 'asleep' ? 1.6 : 0.8;
    S.phase = 'awake';
  }
  S.lastActive = S.t;
}
function boop() {
  S.boop.until = S.t + 1.0;
  S.boop.t0 = S.t;
  const sp = S.springs;
  sp.sy.vel -= 2.6; sp.sx.vel += 1.5; sp.pitch.vel += 0.9;
  S.blink.next = S.t + 1.6;
}
window.addEventListener('pointermove', e => {
  pointerAt(e); P.has = true; activity(); hint.classList.add('gone');
}, { passive: true });
canvas.addEventListener('pointerdown', e => {
  pointerAt(e); P.has = true; activity(); boop(); hint.classList.add('gone');
});
window.addEventListener('pointerup', e => { if (e.pointerType === 'touch') P.has = false; });
window.addEventListener('pointerout', e => { if (!e.relatedTarget) P.has = false; });
window.addEventListener('blur', () => { P.has = false; });

const buttons = [...document.querySelectorAll('#modes button')];
function setForced(mode) { S.forced = mode === 'auto' ? null : mode; updateUI(); }
for (const b of buttons) b.addEventListener('click', () => setForced(b.dataset.mode));
window.addEventListener('keydown', e => {
  const map = { '0': 'auto', 'a': 'auto', '1': 'deadpan', '2': 'wide', '3': 'closed', '4': 'halfopen' };
  if (map[e.key]) setForced(map[e.key]);
});
function updateUI() {
  for (const b of buttons) {
    const m = b.dataset.mode;
    const on = S.forced ? m === S.forced : m === 'auto';
    b.classList.toggle('on', on);
    b.classList.toggle('live', !S.forced && m === S.shown);
    b.setAttribute('aria-pressed', String(on));
  }
}

// ------------------------------------------------------------------ resize
function resize() {
  W = canvas.clientWidth || innerWidth; H = canvas.clientHeight || innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  const tanHalf = Math.tan(CFG.camera.fov / 2 * D2R);
  const dist = Math.max(CFG.camera.fitH, CFG.camera.fitW / camera.aspect) / tanHalf;
  camera.position.set(0, 0.12, dist);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ------------------------------------------------------------------ frame
const _c = new THREE.Vector3();
function update(dt) {
  const now = S.t;
  const idle = now - S.lastActive;
  if (!reduceMotion) {
    if (idle > CFG.idle.sleepAfter) S.phase = 'asleep';
    else if (idle > CFG.idle.drowsyAfter) S.phase = 'drowsy';
  }
  const phase = S.phase;

  // where to look
  let tx = 0, ty = 0;
  if (phase === 'asleep') { tx = 0.05; ty = 0.55; }
  else if (phase === 'drowsy') { tx = P.has ? P.nx * 0.5 : 0; ty = 0.3; }
  else if (P.has && idle < CFG.idle.boredAfter) { tx = P.nx; ty = P.ny; }
  else if (!reduceMotion && idle > CFG.idle.wanderAfter) {
    if (now >= S.wander.next) {
      S.wander.target = P.has && Math.random() < 0.4 ? [P.nx, P.ny] : [rand(-0.5, 0.5), rand(-0.35, 0.3)];
      S.wander.next = now + rand(1.6, 4.2);
    }
    [tx, ty] = S.wander.target;
  } else if (P.has) { tx = P.nx; ty = P.ny; }

  const kG = 1 - Math.exp(-8 * dt);
  S.gaze.x += (tx - S.gaze.x) * kG;
  S.gaze.y += (ty - S.gaze.y) * kG;

  // head springs
  const L = CFG.look, sp = S.springs;
  sp.yaw.target   = tx * L.yaw;
  sp.pitch.target = (ty > 0 ? ty * L.pitchDown : ty * L.pitchUp) + (phase === 'asleep' ? 0.10 : 0);
  sp.roll.target  = -tx * L.roll + (phase === 'asleep' ? 0.05 : 0);
  sp.x.target = tx * L.shiftX;
  sp.y.target = -ty * L.shiftY;
  const omega = phase === 'asleep' ? 3.5 : CFG.spring.omega;
  for (const k of ['yaw', 'pitch', 'roll', 'x', 'y']) stepSpring(sp[k], dt, omega, CFG.spring.zeta);
  stepSpring(sp.sx, dt, 16, 0.32);
  stepSpring(sp.sy, dt, 16, 0.32);
  if (STILL) for (const k in sp) { sp[k].v = sp[k].target; sp[k].vel = 0; }

  // breathing
  const period = phase === 'asleep' ? 4.6 : 3.4;
  const amp = phase === 'asleep' ? 2.2 : 1;
  const br = reduceMotion ? 0 : Math.sin(now * 2 * Math.PI / period);
  neck.rotation.set(sp.pitch.v, sp.yaw.v, sp.roll.v);
  rig.position.set(sp.x.v, sp.y.v + br * 0.012 * amp, 0);
  head.scale.set(sp.sx.v, sp.sy.v * (1 + br * 0.006 * amp), sp.sx.v);
  shadow.position.x = sp.x.v * 0.7;

  // is the pointer over the face?
  if (P.has) {
    _c.copy(rig.position).project(camera);
    const cx = (_c.x + 1) / 2 * W, cy = (1 - _c.y) / 2 * H;
    const rpx = 1.05 / camera.position.z * (H / 2) / Math.tan(CFG.camera.fov / 2 * D2R);
    P.inside = Math.hypot(P.x - cx, P.y - cy) < rpx;
  } else P.inside = false;

  // expression
  const shown = S.forced || autoExpression(now);
  if (shown !== S.shown) { S.shown = shown; S.lidRate = lidRateFor(shown, now); updateUI(); }
  const T = EXPR[shown];
  const kL = 1 - Math.exp(-S.lidRate * dt);
  S.lid.lidY  += (T.lidY  - S.lid.lidY)  * kL;
  S.lid.slant += (T.slant - S.lid.slant) * kL;
  S.lid.curve += (T.curve - S.lid.curve) * kL;

  // blinks
  const B = S.blink;
  const canBlink = shown !== 'closed' && S.boop.until < now && S.startle.until < now && !STILL;
  if (!B.active && canBlink && now >= B.next) { B.active = true; B.t = 0; B.dur = phase === 'drowsy' ? 0.55 : 0.26; }
  let bl = 0;
  if (B.active) {
    B.t += dt;
    const u = B.t / B.dur;
    if (u >= 1) {
      B.active = false;
      const again = Math.random() < 0.22;
      B.next = now + (again ? 0.25 : phase === 'drowsy' ? rand(1.2, 2.6) : rand(2.4, 5.6));
    } else bl = blinkAmount(u);
  }

  const eyes = {
    lidY: lerp(S.lid.lidY, BLINK.lidY, bl),
    slant: S.lid.slant * (1 - bl),
    curve: lerp(S.lid.curve, BLINK.curve, bl),
    px: S.gaze.x * CFG.eye.gazeX,
    py: -S.gaze.y * CFG.eye.gazeY,
  };
  const last = S.lastEyes;
  const dirty = !last || Object.keys(eyes).some(k => Math.abs(eyes[k] - last[k]) > 0.0015);
  if (dirty) { drawEyes(eyes); eyeTex.needsUpdate = true; S.lastEyes = eyes; }
}

let lastMs = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, Math.max(0.001, (nowMs - lastMs) / 1000));
  lastMs = nowMs;
  S.t += dt;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
updateUI();
update(1 / 60);
renderer.render(scene, camera);
requestAnimationFrame(frame);
</script>
</body>
