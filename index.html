<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mascot Close-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap">
<style>
  :root {
    --bg:#2c2d30; --floor-a:#2f3033; --floor-b:#343538;
    --ink:#f2f0e9; --muted:#8c8d93; --rule:#4a4b50;
    color-scheme: dark;
  }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* very subtle checker floor, kept well behind the mascot */
  .floor {
    position:fixed; left:50%; bottom:-4vh; width:400vw; height:500vh;
    transform:translateX(-50%) perspective(1600px) rotateX(62deg); transform-origin:50% 100%;
    background:repeating-conic-gradient(var(--floor-a) 0 25%, var(--floor-b) 0 50%) 50% 100% / var(--tile) var(--tile);
    --tile:min(150px, 24vw);
    -webkit-mask-image:linear-gradient(to top, #000 0%, #000 42%, transparent 100%);
            mask-image:linear-gradient(to top, #000 0%, #000 42%, transparent 100%);
    pointer-events:none;
  }

  .stage {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px, 2.4vh, 22px);
    padding:calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .mascot-wrap { width:min(360px, 84vw, 64vh); margin:0; }
  .mascot { display:block; width:100%; height:auto; overflow:visible; }
  .mascot .expr { display:none; }
  .mascot[data-expr="neutral"]  .expr[data-expr="neutral"],
  .mascot[data-expr="wide"]     .expr[data-expr="wide"],
  .mascot[data-expr="closed"]   .expr[data-expr="closed"],
  .mascot[data-expr="halfopen"] .expr[data-expr="halfopen"] { display:inline; }

  /* minimal motion: a slow 2-3px hover and a matching shadow breath */
  @keyframes hover  { from { transform:translateY(-4px); } to { transform:translateY(4px); } }   /* SVG units: ~1.4px at 360px wide */
  @keyframes shadow { from { transform:scale(.955, .93); opacity:.5; } to { transform:scale(1, 1); opacity:.6; } }
  .mascot .head   { animation:hover 3.8s ease-in-out infinite alternate; }
  .mascot .shadow { transform-box:fill-box; transform-origin:center; animation:shadow 3.8s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .mascot .head, .mascot .shadow { animation:none; } }
  html[data-still] .mascot .head, html[data-still] .mascot .shadow { animation:none; }

  .modes {
    display:flex; justify-content:center; align-items:center; flex-wrap:wrap;
    gap:0 clamp(12px, 3vw, 30px); padding:0 8px; max-width:100%;
  }
  .modes button {
    appearance:none; background:none; border:0; margin:0; padding:10px 2px 8px;
    font:500 15px/1 'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
    letter-spacing:.18em; text-transform:uppercase; color:var(--muted); cursor:pointer; position:relative;
    transition:color .2s ease; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .modes button::after {
    content:''; position:absolute; left:2px; right:2px; bottom:0; height:2px; background:var(--ink);
    transform:scaleX(0); transform-origin:50% 50%; transition:transform .28s cubic-bezier(.2,.7,.2,1);
  }
  .modes button:hover, .modes button.live, .modes button.on { color:var(--ink); }
  .modes button.on::after { transform:scaleX(1); }
  .modes button:focus-visible { outline:2px solid var(--ink); outline-offset:3px; border-radius:2px; }
  .modes .sep { width:1px; height:14px; background:var(--rule); align-self:center; }
  @media (max-width: 480px) {
    .modes { gap:0 9px; }
    .modes button { font-size:12.5px; letter-spacing:.1em; padding:10px 1px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .modes button, .modes button::after { transition:none; } }
</style>
</head>
<body>
<div class="floor" aria-hidden="true"></div>
<main class="stage">
  <figure class="mascot-wrap">
    <!-- mascot:start -->
    <svg class="mascot" viewBox="-9 18 1032 976" width="1032" height="976" role="img" aria-labelledby="mascot-title" data-expr="neutral">
      <title id="mascot-title">Spiky low-poly cat mascot, neutral expression</title>
      <defs>
        <filter id="shadow-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
      </defs>
      <ellipse class="shadow" cx="507" cy="954" rx="279" ry="30" fill="#000" opacity=".5" filter="url(#shadow-blur)"/>
      <g class="head">
        <g class="facets" stroke="#000" stroke-width="2.5" stroke-linejoin="round"><polygon points="507,220 901,30 866,407 1000,402 1011,398 902,553 984,601 893,675 953,788 656,250 507,896 358,250 61,788 121,675 30,601 112,553 3,398 14,402 148,407 113,30" fill="#080808"/><polygon points="896,41 811,394 714,288" fill="#636363"/><polygon points="879,56 714,288 656,250" fill="#5C5C5C"/><polygon points="895,63 855,496 811,394" fill="#5B5B5B"/><polygon points="507,220 656,250 705,284 507,261" fill="#9B9B9B"/><polygon points="507,261 714,288 706,386" fill="#232323"/><polygon points="507,261 697,382 507,359" fill="#8E8E8E"/><polygon points="714,288 804,391 706,386" fill="#141414"/><polygon points="507,359 706,386 507,512" fill="#202020"/><polygon points="706,386 811,394 784,525" fill="#060606"/><polygon points="706,386 784,525 507,512" fill="#5D5D5D"/><polygon points="811,394 853,504 784,525" fill="#060606"/><polygon points="1000,402 855,496 866,407" fill="#969696"/><polygon points="1000,402 1001,410 858,611 853,504" fill="#060606"/><polygon points="853,504 854,645 784,525" fill="#060606"/><polygon points="507,512 784,525 750,680 688,695 507,752" fill="#616161"/><polygon points="786,534 854,655 782,732 750,680" fill="#6C6C6C"/><polygon points="902,553 974,604 865,626 858,611" fill="#4D4D4D"/><polygon points="974,604 893,675 865,626" fill="#252525"/><polygon points="856,619 928,751 854,655" fill="#696969"/><polygon points="854,655 946,785 782,732" fill="#676767"/><polygon points="750,680 761,701 718,796 688,695" fill="#808080"/><polygon points="682,700 718,796 519,752" fill="#2F2F2F"/><polygon points="761,701 782,732 726,791" fill="#6B6B6B"/><polygon points="782,732 937,787 725,800" fill="#4E4E4E"/><polygon points="507,752 718,796 507,896" fill="#060606"/><polygon points="926,792 692,850 725,800" fill="#060606"/><polygon points="715,804 684,854 534,888" fill="#2A2A2A"/><polygon points="300,288 203,394 118,41" fill="#676767"/><polygon points="358,250 300,288 135,56" fill="#7F7F7F"/><polygon points="203,394 159,496 119,63" fill="#424242"/><polygon points="507,261 309,284 358,250 507,220" fill="#909090"/><polygon points="308,386 300,288 507,261" fill="#212121"/><polygon points="507,359 317,382 507,261" fill="#6F6F6F"/><polygon points="308,386 210,391 300,288" fill="#313131"/><polygon points="507,512 308,386 507,359" fill="#070707"/><polygon points="230,525 203,394 308,386" fill="#1A1A1A"/><polygon points="507,512 230,525 308,386" fill="#484848"/><polygon points="230,525 161,504 203,394" fill="#1C1C1C"/><polygon points="148,407 159,496 14,402" fill="#989898"/><polygon points="161,504 156,611 13,410 14,402" fill="#060606"/><polygon points="230,525 160,645 161,504" fill="#141414"/><polygon points="507,752 326,695 264,680 230,525 507,512" fill="#676767"/><polygon points="264,680 232,732 160,655 228,534" fill="#414141"/><polygon points="156,611 149,626 40,604 112,553" fill="#505050"/><polygon points="149,626 121,675 40,604" fill="#282828"/><polygon points="160,655 86,751 158,619" fill="#3A3A3A"/><polygon points="232,732 68,785 160,655" fill="#3B3B3B"/><polygon points="326,695 296,796 253,701 264,680" fill="#797979"/><polygon points="495,752 296,796 332,700" fill="#585858"/><polygon points="288,791 232,732 253,701" fill="#444444"/><polygon points="289,800 77,787 232,732" fill="#252525"/><polygon points="507,896 296,796 507,752" fill="#0E0E0E"/><polygon points="289,800 322,850 88,792" fill="#060606"/><polygon points="480,888 330,854 299,804" fill="#575757"/></g>
        <!-- eyes: a flat layer sitting just in front of the face; never wrapped onto the facet planes -->
        <g class="eyes" fill="#F2F0E9" stroke="#F2F0E9" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
          <g class="expr" data-expr="neutral"><mask id="pupil-n-l" maskUnits="userSpaceOnUse" x="199" y="531" width="248" height="248"><rect x="199" y="531" width="248" height="248" fill="#fff"/><circle cx="335" cy="616.6" r="42" fill="#000"/></mask><path d="M229,621 A100,100 0 1 0 417,621 Q323,595 229,621 Z" mask="url(#pupil-n-l)"/><mask id="pupil-n-r" maskUnits="userSpaceOnUse" x="567" y="531" width="248" height="248"><rect x="567" y="531" width="248" height="248" fill="#fff"/><circle cx="679" cy="616.6" r="42" fill="#000"/></mask><path d="M785,621 A100,100 0 1 1 597,621 Q691,595 785,621 Z" mask="url(#pupil-n-r)"/></g>
          <g class="expr" data-expr="wide"><path fill-rule="evenodd" d="M232,661 A91,109 0 1 0 414,661 A91,109 0 1 0 232,661 Z M277.5,661 A45.5,62 0 1 0 368.5,661 A45.5,62 0 1 0 277.5,661 Z"/><path fill-rule="evenodd" d="M600,661 A91,109 0 1 0 782,661 A91,109 0 1 0 600,661 Z M645.5,661 A45.5,62 0 1 0 736.5,661 A45.5,62 0 1 0 645.5,661 Z"/></g>
          <g class="expr" data-expr="closed"><path d="M235,690 Q323,755 411,690 Q323,719 235,690 Z"/><path d="M603,690 Q691,755 779,690 Q691,719 603,690 Z"/></g>
          <g class="expr" data-expr="halfopen"><mask id="pupil-h-l" maskUnits="userSpaceOnUse" x="199" y="531" width="248" height="248"><rect x="199" y="531" width="248" height="248" fill="#fff"/><circle cx="339" cy="670.5" r="36" fill="#000"/></mask><path d="M223.1,659 A100,100 0 0 0 419.6,681 Q321.3,664 223.1,659 Z" mask="url(#pupil-h-l)"/><mask id="pupil-h-r" maskUnits="userSpaceOnUse" x="567" y="531" width="248" height="248"><rect x="567" y="531" width="248" height="248" fill="#fff"/><circle cx="675" cy="670.5" r="36" fill="#000"/></mask><path d="M790.9,659 A100,100 0 0 1 594.4,681 Q692.7,664 790.9,659 Z" mask="url(#pupil-h-r)"/></g>
        </g>
      </g>
    </svg>
    <!-- mascot:end -->
  </figure>
  <nav class="modes" id="modes" aria-label="Expression">
    <button type="button" data-mode="auto" class="on" aria-pressed="true">Auto</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-mode="neutral" aria-pressed="false">Neutral</button>
    <button type="button" data-mode="wide" aria-pressed="false">Wide</button>
    <button type="button" data-mode="closed" aria-pressed="false">Closed</button>
    <button type="button" data-mode="halfopen" aria-pressed="false">Half-open</button>
  </nav>
</main>

<script>
(() => {
  const EXPRS = ['neutral', 'wide', 'closed', 'halfopen'];
  const LABELS = { neutral: 'neutral', wide: 'wide-eyed', closed: 'eyes closed', halfopen: 'half-open' };
  const CYCLE_MS = 2750;

  const mascot = document.querySelector('.mascot');
  const title = document.getElementById('mascot-title');
  const buttons = [...document.querySelectorAll('#modes button')];

  let forced = null;        // manually selected expression, or null while AUTO cycles
  let shown = 'neutral';
  let timer = 0;

  function show(expr) {
    shown = expr;
    mascot.dataset.expr = expr;
    title.textContent = `Spiky low-poly cat mascot, ${LABELS[expr]} expression`;
    updateUI();
  }
  function stopCycle() { clearInterval(timer); timer = 0; }
  function startCycle() {
    stopCycle();
    timer = setInterval(() => show(EXPRS[(EXPRS.indexOf(shown) + 1) % EXPRS.length]), CYCLE_MS);
  }
  function select(mode) {
    forced = mode === 'auto' ? null : mode;
    if (forced) { stopCycle(); show(forced); }
    else { show(shown); startCycle(); }
  }
  function updateUI() {
    for (const b of buttons) {
      const m = b.dataset.mode;
      const on = forced ? m === forced : m === 'auto';
      b.classList.toggle('on', on);
      b.classList.toggle('live', !forced && m === shown);
      b.setAttribute('aria-pressed', String(on));
    }
  }

  for (const b of buttons) b.addEventListener('click', () => select(b.dataset.mode));
  // number-key shortcuts on top of the regular Tab / Enter / Space button handling
  window.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const map = { '0': 'auto', 'a': 'auto', '1': 'neutral', '2': 'wide', '3': 'closed', '4': 'halfopen' };
    const m = map[e.key.toLowerCase()];
    if (m) select(m);
  });
  document.addEventListener('visibilitychange', () => { if (!forced) (document.hidden ? stopCycle : startCycle)(); });

  // Local debug knobs (ignored when there is no query string):
  //   index.html?expr=wide   force an expression ("deadpan" still maps to neutral)
  //   index.html?still       freeze the hover so screenshots are stable
  const params = new URLSearchParams(location.search);
  if (params.has('still')) document.documentElement.dataset.still = '';
  const wanted = params.get('expr') === 'deadpan' ? 'neutral' : params.get('expr');
  select(EXPRS.includes(wanted) ? wanted : 'auto');
})();
</script>
</body>
</html>
